<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        },
                        darkbg: '#0b0f19',
                        cardbg: '#1e293b',
                        inputbg: '#0f172a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen pb-28">

    <!-- HEADER -->
    <header class="bg-cardbg border-b border-slate-800 sticky top-0 z-30 px-4 py-3">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-dumbbell text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight leading-none">GYM TRACKER</h1>
                    <span class="text-xs text-emerald-400 font-medium">Pro Plan + Stoper Przerw</span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openHistoryModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-2 rounded-lg transition border border-slate-700 flex items-center space-x-1.5">
                    <i class="fa-solid fa-clock-rotate-left text-emerald-400"></i>
                    <span>Historia</span>
                </button>
                <button onclick="openEditModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow-md shadow-emerald-600/20 flex items-center space-x-1.5">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>Edytuj</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-3xl mx-auto px-4 pt-4">
        
        <!-- WEEKS & DAYS BAR -->
        <div class="flex flex-col space-y-3 mb-5">
            <div class="flex items-center justify-between bg-cardbg p-2 rounded-xl border border-slate-800">
                <div class="flex items-center space-x-2 overflow-x-auto custom-scrollbar py-1" id="weeksContainer"></div>
                <button onclick="addNewWeek()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs font-semibold px-3 py-2 rounded-lg border border-slate-700 whitespace-nowrap ml-2 transition">
                    <i class="fa-solid fa-plus mr-1"></i> Tydzień
                </button>
            </div>

            <div class="grid grid-cols-4 gap-2" id="daysTabsContainer"></div>
        </div>

        <!-- WORKOUT CONTENT HEADER -->
        <div class="bg-cardbg rounded-2xl p-4 border border-slate-800 mb-4 shadow-lg">
            <div class="flex items-center justify-between mb-2">
                <div>
                    <span id="activeDayBadge" class="text-xs font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-md border border-emerald-500/20">Dzień 1</span>
                    <h2 id="activeDayTitle" class="text-xl font-bold mt-1 text-white">Push: Klatka + Barki + Triceps</h2>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">TONAŻ CAŁKOWITY</span>
                    <span id="totalTonnage" class="text-lg font-black text-emerald-400">0 kg</span>
                </div>
            </div>
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mt-3">
                <div id="workoutProgressBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
            </div>
            <div class="flex justify-between items-center mt-1 text-[11px] text-slate-400">
                <span id="completedSetsCount">0/0 serii ukończonych</span>
                <span id="workoutProgressPercent">0%</span>
            </div>
        </div>

        <!-- EXERCISES LIST -->
        <div id="exercisesContainer" class="space-y-4"></div>

    </main>

    <!-- FLOATING REST TIMER WIDGET -->
    <div id="restTimerWidget" class="fixed bottom-4 right-4 z-40 bg-[#0d1527] border border-slate-700/80 rounded-2xl shadow-2xl p-4 w-72 backdrop-blur-xl transition-all duration-300">
        <div class="flex items-center justify-between pb-2.5 border-b border-slate-800">
            <div class="flex items-center space-x-2 text-red-500 font-bold text-xs tracking-wider">
                <i class="fa-solid fa-stopwatch text-sm animate-pulse"></i>
                <span>STOPER PRZERW</span>
            </div>
            <div class="flex items-center space-x-1.5">
                <button onclick="toggleTimerSound()" id="soundToggleBtn" class="text-slate-400 hover:text-white text-xs px-1.5 py-1 transition" title="Wycisz / Włącz dźwięk">
                    <i class="fa-solid fa-volume-high" id="soundIcon"></i>
                </button>
                <button onclick="toggleTimerCollapse()" class="text-slate-400 hover:text-white text-xs px-1.5 py-1 transition">
                    <i class="fa-solid fa-chevron-down" id="collapseIcon"></i>
                </button>
            </div>
        </div>

        <div id="timerBody" class="pt-3">
            <div class="text-center my-1">
                <div id="timerDisplay" class="text-4xl font-black tracking-tight text-white font-mono">01:30</div>
                <div id="timerStatusLabel" class="text-[11px] text-slate-400 font-medium mt-0.5">Gotowy do odliczania</div>
            </div>

            <div class="grid grid-cols-4 gap-1.5 my-3">
                <button onclick="setTimerPreset(60)" class="preset-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs py-1.5 rounded-lg border border-slate-700/60 font-semibold transition" data-time="60">60s</button>
                <button onclick="setTimerPreset(90)" class="preset-btn bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 text-xs py-1.5 rounded-lg border border-emerald-500/40 font-semibold transition active-preset" data-time="90">90s</button>
                <button onclick="setTimerPreset(120)" class="preset-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs py-1.5 rounded-lg border border-slate-700/60 font-semibold transition" data-time="120">2m</button>
                <button onclick="setTimerPreset(180)" class="preset-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs py-1.5 rounded-lg border border-slate-700/60 font-semibold transition" data-time="180">3m</button>
            </div>

            <div class="flex space-x-2">
                <button onclick="toggleTimer()" id="timerStartBtn" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-emerald-500/25 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play" id="timerPlayIcon"></i>
                    <span id="timerPlayText">Start</span>
                </button>
                <button onclick="resetTimer()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 py-2.5 rounded-xl text-sm transition border border-slate-700" title="Resetuj">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- EDIT PLAN MODAL -->
    <div id="editModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-cardbg border border-slate-700 w-full max-w-2xl rounded-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
                <h3 class="font-bold text-lg text-white flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-emerald-400"></i>
                    <span>Edytuj Plan, Dni i Ćwiczenia</span>
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-6" id="editModalContent"></div>

            <div class="p-4 border-t border-slate-800 bg-slate-900/50 flex justify-between items-center">
                <button onclick="resetPlanToDefault()" class="text-red-400 hover:text-red-300 text-xs font-semibold px-3 py-2 transition">
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i> Przywróć domyślny plan
                </button>
                <div class="flex space-x-2">
                    <button onclick="closeEditModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-xl text-sm font-semibold transition shadow-lg shadow-emerald-600/20">Gotowe</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HISTORY MODAL -->
    <div id="historyModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-cardbg border border-slate-700 w-full max-w-lg rounded-2xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
                <h3 class="font-bold text-lg text-white flex items-center space-x-2">
                    <i class="fa-solid fa-clock-rotate-left text-emerald-400"></i>
                    <span>Historia Treningów</span>
                </h3>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-3" id="historyModalContent"></div>
            <div class="p-4 border-t border-slate-800 bg-slate-900/50 flex justify-end">
                <button onclick="closeHistoryModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-sm font-semibold transition">Zamknij</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        const defaultPlan = {
            weeks: [
                { id: 1, name: "Tydzień 1" },
                { id: 2, name: "Tydzień 2" }
            ],
            days: [
                {
                    id: 1,
                    badge: "DZIEŃ 1",
                    title: "Push: Klatka + Barki + Triceps",
                    exercises: [
                        { id: 101, name: "Wyciskanie sztangi na ławce poziomej", group: "KLATA", reps: "6-8", tempo: "3110", rir: "2", sets: [ {w:0, r:6, done:false}, {w:0, r:6, done:false}, {w:0, r:6, done:false}, {w:0, r:6, done:false} ] },
                        { id: 102, name: "Wyciskanie hantli na skosie dodatnim", group: "KLATA", reps: "8-10", tempo: "2011", rir: "2", sets: [ {w:0, r:8, done:false}, {w:0, r:8, done:false}, {w:0, r:8, done:false} ] },
                        { id: 103, name: "Wznosy hantli bokiem", group: "BARKI", reps: "12-15", tempo: "2010", rir: "1", sets: [ {w:0, r:12, done:false}, {w:0, r:12, done:false}, {w:0, r:12, done:false} ] },
                        { id: 104, name: "Wyciskanie żołnierskie (OHP)", group: "BARKI", reps: "6-8", tempo: "2110", rir: "2", sets: [ {w:0, r:8, done:false}, {w:0, r:8, done:false}, {w:0, r:8, done:false} ] },
                        { id: 105, name: "Prosty wyciąg ramion do tricepsa", group: "TRICEPS", reps: "10-12", tempo: "2011", rir: "1", sets: [ {w:0, r:10, done:false}, {w:0, r:10, done:false}, {w:0, r:10, done:false} ] }
                    ]
                },
                {
                    id: 2,
                    badge: "DZIEŃ 2",
                    title: "Pull: Plecy + Tył barku + Biceps",
                    exercises: [
                        { id: 201, name: "Ściąganie drążka wyciągu do klatki", group: "PLECY", reps: "8-10", tempo: "3011", rir: "2", sets: [ {w:0, r:10, done:false}, {w:0, r:10, done:false}, {w:0, r:10, done:false} ] },
                        { id: 202, name: "Wiosłowanie sztangą w opadzie tułowia", group: "PLECY", reps: "6-8", tempo: "3010", rir: "2", sets: [ {w:0, r:8, done:false}, {w:0, r:8, done:false}, {w:0, r:8, done:false} ] },
                        { id: 203, name: "Face pull na wyciągu", group: "BARKI", reps: "12-15", tempo: "2012", rir: "1", sets: [ {w:0, r:12, done:false}, {w:0, r:12, done:false}, {w:0, r:12, done:false} ] },
                        { id: 204, name: "Uginanie przedramion z hantlami z supinacją", group: "BICEPS", reps: "10-12", tempo: "2011", rir: "1", sets: [ {w:0, r:10, done:false}, {w:0, r:10, done:false}, {w:0, r:10, done:false} ] }
                    ]
                },
                {
                    id: 3,
                    badge: "DZIEŃ 3",
                    title: "Legs: Nogi + Brzuch",
                    exercises: [
                        { id: 301, name: "Przysiad ze sztangą na plecach", group: "NOGI", reps: "6-8", tempo: "3110", rir: "2", sets: [ {w:0, r:8, done:false}, {w:0, r:8, done:false}, {w:0, r:8, done:false}, {w:0, r:8, done:false} ] },
                        { id: 302, name: "Rumuński martwy ciąg ze sztangą", group: "NOGI", reps: "8-10", tempo: "3020", rir: "2", sets: [ {w:0, r:10, done:false}, {w:0, r:10, done:false}, {w:0, r:10, done:false} ] },
                        { id: 303, name: "Uginanie nóg leżąc (maszyna)", group: "NOGI", reps: "10-12", tempo: "2011", rir: "1", sets: [ {w:0, r:12, done:false}, {w:0, r:12, done:false}, {w:0, r:12, done:false} ] },
                        { id: 304, name: "Allahy na klęcząco (brzuch)", group: "BRZUCH", reps: "12-15", tempo: "2011", rir: "1", sets: [ {w:0, r:15, done:false}, {w:0, r:15, done:false}, {w:0, r:15, done:false} ] }
                    ]
                },
                {
                    id: 4,
                    badge: "DZIEŃ 4",
                    title: "Upper: Góra ciała",
                    exercises: [
                        { id: 401, name: "Wyciskanie hantli na ławce poziomej", group: "KLATA", reps: "8-10", tempo: "2011", rir: "2", sets: [ {w:0, r:10, done:false}, {w:0, r:10, done:false}, {w:0, r:10, done:false} ] },
                        { id: 402, name: "Podciąganie na drążku (lub ściąganie)", group: "PLECY", reps: "6-8", tempo: "3011", rir: "2", sets: [ {w:0, r:8, done:false}, {w:0, r:8, done:false}, {w:0, r:8, done:false} ] },
                        { id: 403, name: "Wznosy ramion bokiem z hantlami", group: "BARKI", reps: "12-15", tempo: "2010", rir: "1", sets: [ {w:0, r:12, done:false}, {w:0, r:12, done:false}, {w:0, r:12, done:false} ] },
                        { id: 404, name: "Superseria: Biceps + Triceps", group: "RAMIONA", reps: "10-12", tempo: "2011", rir: "1", sets: [ {w:0, r:10, done:false}, {w:0, r:10, done:false} ] }
                    ]
                }
            ]
        };

        let appData = JSON.parse(localStorage.getItem('gym_tracker_pro_data')) || defaultPlan;
        let activeWeekId = appData.weeks[0]?.id || 1;
        let activeDayId = appData.days[0]?.id || 1;

        let timerSeconds = 90;
        let timerRemaining = 90;
        let timerInterval = null;
        let isTimerRunning = false;
        let isTimerCollapsed = false;
        let isSoundEnabled = true;

        document.addEventListener('DOMContentLoaded', () => {
            renderWeeks();
            renderDaysTabs();
            renderActiveWorkout();
            updateTimerDisplay();
        });

        function renderWeeks() {
            const container = document.getElementById('weeksContainer');
            container.innerHTML = appData.weeks.map(w => `
                <button onclick="setActiveWeek(${w.id})" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${w.id === activeWeekId ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                    ${w.name}
                </button>
            `).join('');
        }

        function setActiveWeek(weekId) {
            activeWeekId = weekId;
            renderWeeks();
            renderActiveWorkout();
        }

        function addNewWeek() {
            const newId = appData.weeks.length > 0 ? Math.max(...appData.weeks.map(w => w.id)) + 1 : 1;
            appData.weeks.push({ id: newId, name: `Tydzień ${newId}` });
            activeWeekId = newId;
            saveData();
            renderWeeks();
            renderActiveWorkout();
        }

        function renderDaysTabs() {
            const container = document.getElementById('daysTabsContainer');
            container.innerHTML = appData.days.map(d => `
                <button onclick="setActiveDay(${d.id})" class="p-2.5 rounded-xl border text-left transition ${d.id === activeDayId ? 'bg-emerald-600/10 border-emerald-500 text-white shadow-lg shadow-emerald-500/10' : 'bg-cardbg border-slate-800 text-slate-400 hover:bg-slate-800/60'}">
                    <span class="block text-[10px] font-bold uppercase tracking-wider ${d.id === activeDayId ? 'text-emerald-400' : 'text-slate-500'}">${d.badge}</span>
                    <span class="block text-xs font-semibold truncate mt-0.5">${d.title.split(':')[0]}</span>
                </button>
            `).join('');
        }

        function setActiveDay(dayId) {
            activeDayId = dayId;
            renderDaysTabs();
            renderActiveWorkout();
        }

        function renderActiveWorkout() {
            const day = appData.days.find(d => d.id === activeDayId) || appData.days[0];
            
            document.getElementById('activeDayBadge').innerText = day.badge;
            document.getElementById('activeDayTitle').innerText = day.title;

            const container = document.getElementById('exercisesContainer');
            
            if (!day.exercises || day.exercises.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-cardbg rounded-2xl border border-slate-800">
                        <i class="fa-solid fa-clipboard-list text-slate-600 text-4xl mb-3"></i>
                        <p class="text-slate-400 text-sm">Brak ćwiczeń w tym dniu.</p>
                        <button onclick="openEditModal()" class="mt-3 bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-xl font-semibold transition">Dodaj ćwiczenia</button>
                    </div>
                `;
                updateProgress(0, 0, 0);
                return;
            }

            let totalSets = 0;
            let completedSets = 0;
            let totalTonnage = 0;

            container.innerHTML = day.exercises.map((ex, exIndex) => {
                let setsHtml = ex.sets.map((set, setIndex) => {
                    totalSets++;
                    if (set.done) {
                        completedSets++;
                        totalTonnage += (parseFloat(set.w) || 0) * (parseFloat(set.r) || 0);
                    }
                    return `
                        <div class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/80">
                            <span class="text-xs font-bold text-slate-500 w-6 text-center">#${setIndex + 1}</span>
                            <div class="relative flex-1">
                                <input type="number" inputmode="decimal" placeholder="0" value="${set.w || ''}" oninput="updateSetData(${exIndex}, ${setIndex}, 'w', this.value)" class="w-full bg-inputbg text-white text-sm font-semibold px-3 py-1.5 rounded-lg border border-slate-700 focus:border-emerald-500 focus:outline-none pr-8">
                                <span class="absolute right-2.5 top-2 text-[10px] text-slate-500 font-bold">kg</span>
                            </div>
                            <div class="relative flex-1">
                                <input type="number" inputmode="numeric" placeholder="0" value="${set.r || ''}" oninput="updateSetData(${exIndex}, ${setIndex}, 'r', this.value)" class="w-full bg-inputbg text-white text-sm font-semibold px-3 py-1.5 rounded-lg border border-slate-700 focus:border-emerald-500 focus:outline-none pr-10">
                                <span class="absolute right-2.5 top-2 text-[10px] text-slate-500 font-bold">powt.</span>
                            </div>
                            <button onclick="toggleSetDone(${exIndex}, ${setIndex})" class="w-9 h-9 rounded-lg flex items-center justify-center transition ${set.done ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30' : 'bg-slate-800 text-slate-500 hover:text-slate-300 border border-slate-700'}">
                                <i class="fa-solid fa-check text-xs"></i>
                            </button>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-cardbg rounded-2xl p-4 border border-slate-800 shadow-md">
                        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800/60">
                            <div class="flex items-center space-x-2">
                                <span class="text-[10px] font-bold bg-slate-800 text-emerald-400 px-2 py-0.5 rounded border border-slate-700">${ex.group}</span>
                                <span class="text-xs text-slate-400 font-medium">Reps: <strong class="text-slate-200">${ex.reps}</strong> | Tempo: <strong class="text-slate-200">${ex.tempo}</strong> | RIR: <strong class="text-slate-200">${ex.rir}</strong></span>
                            </div>
                        </div>
                        <h3 class="font-bold text-sm sm:text-base text-white mb-3">${exIndex + 1}. ${ex.name}</h3>
                        <div class="space-y-2">
                            ${setsHtml}
                        </div>
                    </div>
                `;
            }).join('');

            updateProgress(completedSets, totalSets, totalTonnage);
        }

        function updateSetData(exIndex, setIndex, field, value) {
            const day = appData.days.find(d => d.id === activeDayId);
            day.exercises[exIndex].sets[setIndex][field] = value;
            saveData();
        }

        function toggleSetDone(exIndex, setIndex) {
            const day = appData.days.find(d => d.id === activeDayId);
            const setObj = day.exercises[exIndex].sets[setIndex];
            setObj.done = !setObj.done;
            saveData();
            renderActiveWorkout();

            if (setObj.done) {
                startTimer();
            }
        }

        function updateProgress(completed, total, tonnage) {
            document.getElementById('totalTonnage').innerText = `${tonnage.toLocaleString()} kg`;
            document.getElementById('completedSetsCount').innerText = `${completed}/${total} serii ukończonych`;
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            document.getElementById('workoutProgressPercent').innerText = `${percent}%`;
            document.getElementById('workoutProgressBar').style.width = `${percent}%`;

            if (percent === 100 && total > 0) {
                saveWorkoutHistory(tonnage);
            }
        }

        function saveData() {
            localStorage.setItem('gym_tracker_pro_data', JSON.stringify(appData));
        }

        function saveWorkoutHistory(tonnage) {
            const day = appData.days.find(d => d.id === activeDayId);
            let history = JSON.parse(localStorage.getItem('gym_tracker_history')) || [];
            const dateStr = new Date().toLocaleDateString('pl-PL', { day: 'numeric', month: 'short', year: 'numeric' });
            
            const existingIndex = history.findIndex(h => h.date === dateStr && h.dayTitle === day.title && h.weekId === activeWeekId);
            const record = { date: dateStr, week: activeWeekId, dayTitle: day.title, tonnage: tonnage };
            
            if (existingIndex >= 0) {
                history[existingIndex] = record;
            } else {
                history.unshift(record);
            }
            localStorage.setItem('gym_tracker_history', JSON.stringify(history));
        }

        function openHistoryModal() {
            const container = document.getElementById('historyModalContent');
            let history = JSON.parse(localStorage.getItem('gym_tracker_history')) || [];

            if (history.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 text-sm py-8">Brak zapisanych ukończonych treningów.</p>`;
            } else {
                container.innerHTML = history.map(h => `
                    <div class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-800 flex items-center justify-between">
                        <div>
                            <span class="text-xs text-emerald-400 font-semibold">${h.date} (Tydzień ${h.week})</span>
                            <h4 class="font-bold text-sm text-white mt-0.5">${h.dayTitle}</h4>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-slate-500 block">Tonaż</span>
                            <span class="font-bold text-sm text-emerald-400">${h.tonnage.toLocaleString()} kg</span>
                        </div>
                    </div>
                `).join('');
            }
            document.getElementById('historyModal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.add('hidden');
        }

        function openEditModal() {
            const container = document.getElementById('editModalContent');
            container.innerHTML = appData.days.map((day, dIdx) => {
                let exHtml = day.exercises.map((ex, eIdx) => `
                    <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-2 mb-2">
                        <div class="flex items-center space-x-2">
                            <input type="text" value="${ex.name}" oninput="editExerciseName(${dIdx}, ${eIdx}, this.value)" class="flex-1 bg-inputbg text-white text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700">
                            <input type="text" value="${ex.group}" oninput="editExerciseGroup(${dIdx}, ${eIdx}, this.value)" class="w-24 bg-inputbg text-white text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700" placeholder="Partia">
                            <button onclick="removeExercise(${dIdx}, ${eIdx})" class="text-red-400 hover:text-red-300 p-1.5"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                        <div class="flex space-x-2 text-xs">
                            <div class="flex items-center space-x-1 flex-1">
                                <span class="text-slate-500">Reps:</span>
                                <input type="text" value="${ex.reps}" oninput="editExerciseField(${dIdx}, ${eIdx}, 'reps', this.value)" class="w-full bg-inputbg text-white px-2 py-1 rounded border border-slate-700">
                            </div>
                            <div class="flex items-center space-x-1 flex-1">
                                <span class="text-slate-500">Serie:</span>
                                <input type="number" value="${ex.sets.length}" oninput="editExerciseSetsCount(${dIdx}, ${eIdx}, this.value)" class="w-full bg-inputbg text-white px-2 py-1 rounded border border-slate-700">
                            </div>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="bg-slate-900/40 p-4 rounded-2xl border border-slate-800 space-y-3">
                        <div class="grid grid-cols-2 gap-2 pb-2 border-b border-slate-800">
                            <div>
                                <label class="text-[10px] text-slate-500 font-bold block mb-1">Etykieta dnia:</label>
                                <input type="text" value="${day.badge}" oninput="editDayBadge(${dIdx}, this.value)" class="w-full bg-inputbg text-white text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-500 font-bold block mb-1">Nazwa dnia:</label>
                                <input type="text" value="${day.title}" oninput="editDayTitle(${dIdx}, this.value)" class="w-full bg-inputbg text-white text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700">
                            </div>
                        </div>
                        <div>
                            <span class="text-xs font-bold text-slate-400 block mb-2">Ćwiczenia w tym dniu:</span>
                            ${exHtml}
                            <button onclick="addNewExerciseToDay(${dIdx})" class="w-full mt-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs font-semibold py-2 rounded-xl border border-slate-700 transition">
                                <i class="fa-solid fa-plus mr-1"></i> Dodaj ćwiczenie
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            renderDaysTabs();
            renderActiveWorkout();
        }

        function editDayBadge(dIdx, val) { 
            appData.days[dIdx].badge = val; 
            saveData(); 
            renderDaysTabs();
        }
        
        function editDayTitle(dIdx, val) { 
            appData.days[dIdx].title = val; 
            saveData(); 
            renderDaysTabs();
        }

        function editExerciseName(dIdx, eIdx, val) { appData.days[dIdx].exercises[eIdx].name = val; saveData(); }
        function editExerciseGroup(dIdx, eIdx, val) { appData.days[dIdx].exercises[eIdx].group = val; saveData(); }
        function editExerciseField(dIdx, eIdx, field, val) { appData.days[dIdx].exercises[eIdx][field] = val; saveData(); }
        
        function editExerciseSetsCount(dIdx, eIdx, count) {
            let num = parseInt(count) || 1;
            let ex = appData.days[dIdx].exercises[eIdx];
            if (num > ex.sets.length) {
                while(ex.sets.length < num) ex.sets.push({w:0, r:8, done:false});
            } else {
                ex.sets = ex.sets.slice(0, num);
            }
            saveData();
        }

        function removeExercise(dIdx, eIdx) {
            appData.days[dIdx].exercises.splice(eIdx, 1);
            saveData();
            openEditModal();
        }

        function addNewExerciseToDay(dIdx) {
            appData.days[dIdx].exercises.push({
                id: Date.now(),
                name: "Nowe ćwiczenie",
                group: "PARTIA",
                reps: "8-10",
                tempo: "2011",
                rir: "2",
                sets: [{w:0, r:10, done:false}, {w:0, r:10, done:false}, {w:0, r:10, done:false}]
            });
            saveData();
            openEditModal();
        }

        function resetPlanToDefault() {
            if (confirm("Czy na pewno chcesz przywrócić domyślny plan?")) {
                appData = JSON.parse(JSON.stringify(defaultPlan));
                saveData();
                closeEditModal();
                renderWeeks();
                renderDaysTabs();
                renderActiveWorkout();
            }
        }

        function setTimerPreset(seconds) {
            timerSeconds = seconds;
            timerRemaining = seconds;
            pauseTimer();
            updateTimerDisplay();

            document.querySelectorAll('.preset-btn').forEach(btn => {
                if (parseInt(btn.getAttribute('data-time')) === seconds) {
                    btn.className = "preset-btn bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 text-xs py-1.5 rounded-lg border border-emerald-500/40 font-semibold transition active-preset";
                } else {
                    btn.className = "preset-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs py-1.5 rounded-lg border border-slate-700/60 font-semibold transition";
                }
            });
        }

        function toggleTimer() {
            if (isTimerRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (isTimerRunning) return;
            if (timerRemaining <= 0) timerRemaining = timerSeconds;
            
            isTimerRunning = true;
            document.getElementById('timerPlayIcon').className = "fa-solid fa-pause";
            document.getElementById('timerPlayText').innerText = "Pauza";
            document.getElementById('timerStatusLabel').innerText = "Odliczanie...";
            document.getElementById('timerStatusLabel').className = "text-[11px] text-emerald-400 font-medium mt-0.5 animate-pulse";

            timerInterval = setInterval(() => {
                timerRemaining--;
                updateTimerDisplay();

                if (timerRemaining <= 0) {
                    clearInterval(timerInterval);
                    isTimerRunning = false;
                    document.getElementById('timerPlayIcon').className = "fa-solid fa-play";
                    document.getElementById('timerPlayText').innerText = "Start";
                    document.getElementById('timerStatusLabel').innerText = "Koniec przerwy!";
                    document.getElementById('timerStatusLabel').className = "text-[11px] text-red-400 font-bold mt-0.5";
                    playBeepSound();
                }
            }, 1000);
        }

        function pauseTimer() {
            isTimerRunning = false;
            clearInterval(timerInterval);
            document.getElementById('timerPlayIcon').className = "fa-solid fa-play";
            document.getElementById('timerPlayText').innerText = "Start";
            document.getElementById('timerStatusLabel').innerText = "Zatrzymany";
            document.getElementById('timerStatusLabel').className = "text-[11px] text-slate-400 font-medium mt-0.5";
        }

        function resetTimer() {
            pauseTimer();
            timerRemaining = timerSeconds;
            updateTimerDisplay();
            document.getElementById('timerStatusLabel').innerText = "Gotowy do odliczania";
            document.getElementById('timerStatusLabel').className = "text-[11px] text-slate-400 font-medium mt-0.5";
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerRemaining / 60);
            const secs = timerRemaining % 60;
            document.getElementById('timerDisplay').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function toggleTimerCollapse() {
            isTimerCollapsed = !isTimerCollapsed;
            const body = document.getElementById('timerBody');
            const icon = document.getElementById('collapseIcon');
            const widget = document.getElementById('restTimerWidget');

            if (isTimerCollapsed) {
                body.classList.add('hidden');
                icon.className = "fa-solid fa-chevron-up";
                widget.style.width = "180px";
            } else {
                body.classList.remove('hidden');
                icon.className = "fa-solid fa-chevron-down";
                widget.style.width = "288px";
            }
        }

        function toggleTimerSound() {
            isSoundEnabled = !isSoundEnabled;
            const icon = document.getElementById('soundIcon');
            if (isSoundEnabled) {
                icon.className = "fa-solid fa-volume-high";
            } else {
                icon.className = "fa-solid fa-volume-xmark";
            }
        }

        function playBeepSound() {
            if (!isSoundEnabled) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {
                console.log("Audio not supported");
            }
        }
    </script>
</body>
</html>
