<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        },
                        darkbg: '#0b0f19',
                        cardbg: '#1e293b',
                        inputbg: '#0f172a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pulse-emerald {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }
        .animate-pulse-subtle {
            animation: pulse-emerald 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-16">

    <header class="sticky top-0 z-40 bg-[#0f172a]/95 backdrop-blur-md border-b border-slate-800 shadow-md">
        <div class="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-blue-500 flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-dumbbell text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-white leading-tight">GYM TRACKER</h1>
                    <p class="text-[11px] text-emerald-400 font-medium">Pro Plan + Stoper Przerw</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="openHistoryModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-blue-400 hover:text-blue-300 px-2.5 py-1.5 rounded-lg border border-slate-700 transition flex items-center space-x-1">
                    <i class="fa-solid fa-chart-line text-xs"></i>
                    <span>Historia</span>
                </button>
                <button onclick="openEditModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-emerald-400 hover:text-emerald-300 px-2.5 py-1.5 rounded-lg border border-slate-700 transition flex items-center space-x-1">
                    <i class="fa-solid fa-pen-to-square text-xs"></i>
                    <span>Edytuj</span>
                </button>
            </div>
        </div>

        <!-- WEEK SELECTOR DROPDOWN -->
        <div class="max-w-md mx-auto px-3 py-2 border-t border-slate-800/80 flex items-center justify-between bg-slate-900/60">
            <div class="relative flex-1 mr-3">
                <select id="week-selector" onchange="switchWeek(this.value)" class="w-full bg-slate-800 text-white border border-slate-700 rounded-lg pl-3 pr-8 py-1.5 text-sm font-bold focus:outline-none focus:border-blue-500 appearance-none cursor-pointer">
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </div>
            </div>
            <button onclick="addNewWeek()" class="px-2.5 py-1.5 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 border border-emerald-500/40 text-xs font-bold rounded-lg transition whitespace-nowrap flex items-center space-x-1">
                <i class="fa-solid fa-plus text-[10px]"></i>
                <span>Tydzień</span>
            </button>
        </div>

        <!-- DAY TABS -->
        <div id="day-tabs-container" class="max-w-md mx-auto px-2 pb-2 pt-1 overflow-x-auto no-scrollbar flex space-x-1 text-xs">
            <!-- Rendered dynamically -->
        </div>
    </header>

    <main class="max-w-md mx-auto w-full px-3 pt-4 flex-1">
        
        <!-- DAY BANNER & STATS -->
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 mb-4 backdrop-blur-sm shadow-lg">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <div class="flex items-center space-x-2 mb-1">
                        <span id="week-badge" class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-blue-500/20 text-blue-400 border border-blue-500/30 uppercase">
                            TYDZIEŃ 1
                        </span>
                        <span id="day-badge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 uppercase">
                            DZIEŃ 1
                        </span>
                    </div>
                    <h2 id="day-title" class="text-lg font-bold text-white">Push: Klatka + Barki + Triceps</h2>
                </div>
                <div class="text-right">
                    <span class="text-[11px] text-slate-400 block uppercase tracking-wider font-medium">Tonaż całkowity</span>
                    <span id="total-volume" class="text-xl font-extrabold text-emerald-400">0 <span class="text-xs font-normal text-slate-300">kg</span></span>
                </div>
            </div>

            <!-- PROGRESS BAR -->
            <div class="mt-3">
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                    <span>Postęp treningu</span>
                    <span id="progress-percentage" class="font-bold text-slate-200">0%</span>
                </div>
                <div class="w-full h-2 bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-blue-500 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- EXERCISES LIST CONTAINER -->
        <div id="exercises-container" class="space-y-4">
            <!-- Dynamic exercise cards injected via JavaScript -->
        </div>

    </main>

    <!-- FLOATING CORNER REST TIMER WIDGET -->
    <div id="rest-timer-widget" class="fixed bottom-4 right-4 z-50 transition-all duration-300">
        <div id="timer-card" class="w-72 bg-[#0d1527] border border-slate-800 rounded-2xl p-4 shadow-2xl backdrop-blur-md transition-all">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-stopwatch text-red-500 text-sm"></i>
                    <span class="text-xs font-extrabold text-white tracking-wide uppercase">STOPER PRZERW</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="toggleTimerSound()" id="timer-sound-btn" class="text-slate-400 hover:text-emerald-400 text-xs p-1 transition" title="Włącz/wyłącz dźwięk">
                        <i id="sound-icon" class="fa-solid fa-volume-high"></i>
                    </button>
                    <button onclick="toggleWidgetCollapse()" class="text-slate-400 hover:text-white text-xs p-1 transition" title="Zwiń stoper">
                        <i id="collapse-chevron" class="fa-solid fa-chevron-down"></i>
                    </button>
                </div>
            </div>

            <div class="text-center my-3.5">
                <div id="timer-display" class="text-4xl font-black text-white tracking-widest font-mono drop-shadow">01:30</div>
                <div id="timer-status-text" class="text-[11px] text-slate-400 mt-1 font-medium">Gotowy do odliczania</div>
            </div>

            <div class="grid grid-cols-4 gap-1.5 mb-3.5">
                <button onclick="setTimerPreset(60)" id="preset-60" class="timer-preset-btn py-1.5 bg-[#172033] hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700/50 transition active:scale-95">60s</button>
                <button onclick="setTimerPreset(90)" id="preset-90" class="timer-preset-btn py-1.5 bg-[#172033] hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700/50 transition active:scale-95">90s</button>
                <button onclick="setTimerPreset(120)" id="preset-120" class="timer-preset-btn py-1.5 bg-[#172033] hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700/50 transition active:scale-95">2m</button>
                <button onclick="setTimerPreset(180)" id="preset-180" class="timer-preset-btn py-1.5 bg-[#172033] hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700/50 transition active:scale-95">3m</button>
            </div>

            <div class="flex items-center space-x-2">
                <button id="timer-toggle-btn" onclick="toggleTimer()" class="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-extrabold text-sm rounded-2xl shadow-lg shadow-emerald-500/25 transition flex items-center justify-center space-x-2">
                    <i id="timer-toggle-icon" class="fa-solid fa-play text-xs"></i>
                    <span id="timer-toggle-text">Start</span>
                </button>
                <button onclick="resetTimer()" class="w-11 h-11 bg-[#172033] hover:bg-slate-700 active:scale-95 text-slate-300 border border-slate-700/60 rounded-2xl transition flex items-center justify-center text-sm shadow" title="Resetuj stoper">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <button id="timer-minimized-pill" onclick="toggleWidgetCollapse()" class="hidden bg-[#0d1527] border border-emerald-500/60 hover:border-emerald-400 text-white px-3.5 py-2.5 rounded-full shadow-2xl backdrop-blur-md flex items-center space-x-2 transition active:scale-95">
            <i class="fa-solid fa-stopwatch text-red-500 text-sm"></i>
            <span id="minimized-timer-display" class="font-mono font-bold text-xs text-emerald-400">01:30</span>
            <i class="fa-solid fa-chevron-up text-slate-400 text-[10px]"></i>
        </button>
    </div>

    <!-- YOUTUBE VIDEO MODAL -->
    <div id="video-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 transition-opacity">
        <div class="bg-slate-800 border border-slate-70
